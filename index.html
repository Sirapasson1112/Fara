<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>เป๋าตังค์จด - บันทึกรายรับรายจ่าย</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #EEF2F6;
      --card-bg: #FFFFFF;
      --hero-bg: #0B192C;
      --text-main: #0F172A;
      --text-sub: #475569;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .font-num {
      font-family: 'Chakra Petch', 'Prompt', sans-serif;
      font-variant-numeric: tabular-nums;
    }

    /* กรอบตัดมุมสไตล์เกราะอเวนเจอร์ */
    .armor-card {
      clip-path: polygon(
        14px 0%, calc(100% - 14px) 0%,
        100% 14px, 100% calc(100% - 14px),
        calc(100% - 14px) 100%, 14px 100%,
        0% calc(100% - 14px), 0% 14px
      );
    }

    .armor-btn {
      clip-path: polygon(
        10px 0%, calc(100% - 10px) 0%,
        100% 10px, 100% calc(100% - 10px),
        calc(100% - 10px) 100%, 10px 100%,
        0% calc(100% - 10px), 0% 10px
      );
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    .arc-spin-slow {
      transform-origin: 100px 100px;
      animation: spinSlow 24s linear infinite;
    }

    .arc-spin-rev {
      transform-origin: 100px 100px;
      animation: spinReverse 16s linear infinite;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen pb-10">

  <div class="max-w-md mx-auto px-3.5 pt-3 space-y-3.5">

    <!-- แถบด้านบน: ชื่อแอป & นาฬิกาเวลาประเทศไทย -->
    <header class="bg-white border border-slate-200 rounded-2xl px-4 py-3 shadow-sm flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center text-white shadow-sm shrink-0">
          <!-- ไอคอนแกนพลังงาน -->
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="12 3 21 19 3 19" stroke-linejoin="round" />
            <circle cx="12" cy="14" r="2.2" fill="currentColor" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">เป๋าตังค์จด</h1>
          <div class="flex items-center gap-1.5 text-xs font-medium text-emerald-700">
            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
            <span>เวลาประเทศไทย</span>
          </div>
        </div>
      </div>

      <div class="text-right">
        <div id="thai-clock" class="font-num text-xl font-bold text-slate-900 leading-none tracking-wide">00:00:00</div>
        <div id="thai-date" class="text-xs font-medium text-slate-600 mt-1">กำลังโหลดวันที่...</div>
      </div>
    </header>

    <!-- การ์ดหลัก: เงินคงเหลือ & สัญลักษณ์อเวนเจอร์ -->
    <section class="relative bg-[#0B192C] text-white armor-card p-5 shadow-md overflow-hidden">
      <!-- กราฟิก Arc Reactor ด้านหลัง (โปร่งบาง ไม่กวนตัวหนังสือ) -->
      <div class="pointer-events-none absolute -right-8 -top-8 w-52 h-52 opacity-25">
        <svg viewBox="0 0 200 200" class="w-full h-full">
          <circle id="arc-outer-ring" cx="100" cy="100" r="88" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="18 8" class="arc-spin-slow" />
          <circle id="arc-mid-ring" cx="100" cy="100" r="66" fill="none" stroke="#38BDF8" stroke-width="5" stroke-dasharray="28 12" class="arc-spin-rev" />
          <polygon id="arc-tri" points="100,45 148,132 52,132" fill="none" stroke="#38BDF8" stroke-width="3.5" />
          <circle id="arc-core" cx="100" cy="103" r="18" fill="#38BDF8" />
        </svg>
      </div>

      <!-- แถวเลือกฮีโร่ & ปุ่มซ่อนยอด -->
      <div class="relative z-10 flex items-center justify-between gap-2 mb-3">
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          <button type="button" onclick="setHero('ironman')" id="hero-ironman" class="hero-pill px-2.5 py-1 rounded-lg text-xs font-semibold border transition flex items-center gap-1">
            <span>🦾</span><span>ไอรอนแมน</span>
          </button>
          <button type="button" onclick="setHero('captain')" id="hero-captain" class="hero-pill px-2.5 py-1 rounded-lg text-xs font-semibold border transition flex items-center gap-1">
            <span>🛡️</span><span>กัปตัน</span>
          </button>
          <button type="button" onclick="setHero('thor')" id="hero-thor" class="hero-pill px-2.5 py-1 rounded-lg text-xs font-semibold border transition flex items-center gap-1">
            <span>⚡</span><span>ธอร์</span>
          </button>
          <button type="button" onclick="setHero('panther')" id="hero-panther" class="hero-pill px-2.5 py-1 rounded-lg text-xs font-semibold border transition flex items-center gap-1">
            <span>🐾</span><span>แพนเธอร์</span>
          </button>
        </div>

        <button type="button" onclick="toggleHideBalance()" id="btn-hide-balance" class="shrink-0 bg-white/15 hover:bg-white/25 text-white px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
          <span id="eye-icon">👁️</span>
          <span id="eye-text">ซ่อนยอด</span>
        </button>
      </div>

      <!-- ยอดเงินคงเหลือ -->
      <div class="relative z-10 my-2">
        <div class="flex items-center gap-2">
          <span class="text-sm font-medium text-slate-200">เงินคงเหลือสุทธิ</span>
          <span id="energy-badge" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-sky-500/25 text-sky-200 border border-sky-400/40">
            พลังงานเต็มเปี่ยม
          </span>
        </div>
        <div id="balance-display" class="font-num text-4xl font-bold text-white tracking-tight mt-1">
          ฿0.00
        </div>
      </div>

      <!-- กล่องสรุปรายรับ / รายจ่าย แยกชัดเจน -->
      <div class="relative z-10 grid grid-cols-2 gap-2.5 mt-4">
        <div class="bg-white/10 border border-white/15 rounded-xl px-3.5 py-2.5">
          <div class="flex items-center gap-1.5 text-xs font-semibold text-emerald-300">
            <span>▲</span>
            <span>รายรับรวม</span>
          </div>
          <div id="income-display" class="font-num text-xl font-bold text-white mt-0.5">฿0</div>
        </div>

        <div class="bg-white/10 border border-white/15 rounded-xl px-3.5 py-2.5">
          <div class="flex items-center gap-1.5 text-xs font-semibold text-rose-300">
            <span>▼</span>
            <span>รายจ่ายรวม</span>
          </div>
          <div id="expense-display" class="font-num text-xl font-bold text-white mt-0.5">฿0</div>
        </div>
      </div>
    </section>

    <!-- กล่องจดรายการใหม่ (จบในหน้าเดียว ใช้งานง่าย) -->
    <section class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3.5">
      <div class="flex items-center justify-between">
        <h2 id="form-title" class="text-base font-bold text-slate-900 flex items-center gap-2">
          <span class="w-2 h-5 bg-red-600 rounded-sm inline-block"></span>
          <span>จดรายการใหม่</span>
        </h2>

        <button type="button" onclick="toggleCustomTime()" class="text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition">
          <span>🕒</span>
          <span id="time-toggle-label">เวลาตอนนี้</span>
        </button>
      </div>

      <!-- ช่องแก้เวลาไทยย้อนหลัง (พับเก็บได้) -->
      <div id="custom-time-box" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-700">เลือกวันที่และเวลาไทย</span>
          <button type="button" onclick="resetToNowThai()" class="text-xs font-bold text-blue-700 hover:underline">
            ตั้งเป็นเวลาตอนนี้
          </button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input type="date" id="input-date" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-2 text-sm font-medium text-slate-900" />
          <input type="time" id="input-time" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-2 text-sm font-medium text-slate-900" />
        </div>
      </div>

      <!-- ปุ่มสลับ จ่ายออก / รับเข้า -->
      <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-xl">
        <button type="button" id="type-expense" onclick="setTxType('expense')" class="py-2.5 rounded-lg text-base font-bold transition flex items-center justify-center gap-1.5 bg-red-600 text-white shadow-sm">
          <span>➖</span>
          <span>จ่ายออก</span>
        </button>
        <button type="button" id="type-income" onclick="setTxType('income')" class="py-2.5 rounded-lg text-base font-bold transition flex items-center justify-center gap-1.5 text-slate-700 hover:bg-white/60">
          <span>➕</span>
          <span>รับเข้า</span>
        </button>
      </div>

      <!-- ช่องกรอกจำนวนเงินขนาดใหญ่ -->
      <div class="bg-slate-50 border-2 border-slate-300 focus-within:border-slate-900 rounded-2xl px-4 py-3 flex items-center justify-between transition">
        <span class="text-2xl font-bold text-slate-500">฿</span>
        <input
          type="number"
          inputmode="decimal"
          step="any"
          id="input-amount"
          placeholder="0"
          class="font-num w-full text-right text-4xl font-bold text-slate-900 bg-transparent outline-none"
        />
      </div>

      <!-- ปุ่มบวกเงินลัด -->
      <div class="grid grid-cols-5 gap-1.5">
        <button type="button" onclick="addQuickAmount(50)" class="py-2 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-sm font-bold text-slate-800 transition">+50</button>
        <button type="button" onclick="addQuickAmount(100)" class="py-2 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-sm font-bold text-slate-800 transition">+100</button>
        <button type="button" onclick="addQuickAmount(500)" class="py-2 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-sm font-bold text-slate-800 transition">+500</button>
        <button type="button" onclick="addQuickAmount(1000)" class="py-2 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-sm font-bold text-slate-800 transition">+1,000</button>
        <button type="button" onclick="clearAmount()" class="py-2 rounded-xl bg-amber-100 hover:bg-amber-200 active:scale-95 text-sm font-bold text-amber-900 transition">ล้าง</button>
      </div>

      <!-- หมวดหมู่ 6 หมวด เข้าใจง่าย -->
      <div>
        <div class="text-xs font-bold text-slate-600 mb-2">เลือกหมวดหมู่</div>
        <div id="category-grid" class="grid grid-cols-3 gap-2"></div>
      </div>

      <!-- ช่องบันทึกช่วยจำ (ไม่บังคับ) -->
      <div>
        <input
          type="text"
          id="input-note"
          placeholder="จดรายละเอียดเพิ่ม เช่น ข้าวมันไก่, ค่าน้ำมัน (ไม่ใส่ก็ได้)"
          class="w-full bg-slate-50 border border-slate-300 focus:border-slate-900 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 outline-none"
        />
      </div>

      <!-- ปุ่มบันทึกหลัก -->
      <div class="flex gap-2 pt-1">
        <button type="button" id="btn-cancel-edit" onclick="cancelEdit()" class="hidden px-4 py-3.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-base transition">
          ยกเลิก
        </button>
        <button type="button" id="btn-submit" onclick="saveTransaction()" class="w-full armor-btn bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white font-bold text-lg py-3.5 shadow-sm transition flex items-center justify-center gap-2">
          <span>✔</span>
          <span id="submit-label">บันทึกเลย</span>
        </button>
      </div>
    </section>

    <!-- ส่วนประวัติรายการล่าสุด -->
    <section class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
      <div class="flex items-center justify-between gap-2">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <span class="w-2 h-5 bg-slate-900 rounded-sm inline-block"></span>
          <span>ประวัติรายการ</span>
        </h2>

        <!-- ตัวกรองช่วงเวลา -->
        <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
          <button type="button" onclick="setFilter('today')" id="filter-today" class="px-2.5 py-1 rounded-lg transition">วันนี้</button>
          <button type="button" onclick="setFilter('month')" id="filter-month" class="px-2.5 py-1 rounded-lg transition">เดือนนี้</button>
          <button type="button" onclick="setFilter('all')" id="filter-all" class="px-2.5 py-1 rounded-lg transition">ทั้งหมด</button>
        </div>
      </div>

      <!-- รายการธุรกรรม -->
      <div id="transaction-list" class="space-y-2.5"></div>

      <!-- ปุ่มจัดการข้อมูลด้านล่าง -->
      <div class="pt-3 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2">
        <button type="button" onclick="loadSampleData()" class="text-xs font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 px-3 py-2 rounded-xl transition">
          + โหลดข้อมูลตัวอย่าง
        </button>

        <div class="flex items-center gap-2">
          <button type="button" onclick="exportCSV()" class="text-xs font-bold text-emerald-800 bg-emerald-50 hover:bg-emerald-100 px-3 py-2 rounded-xl transition">
            ⬇ ดาวน์โหลด Excel
          </button>
          <button type="button" onclick="clearAllData()" class="text-xs font-bold text-rose-700 bg-rose-50 hover:bg-rose-100 px-3 py-2 rounded-xl transition">
            🗑️ ล้างข้อมูล
          </button>
        </div>
      </div>
    </section>

  </div>

  <!-- แจ้งเตือนมุมล่าง (Toast) -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50 whitespace-nowrap">
    บันทึกเรียบร้อย
  </div>

  <script>
    const STORAGE_KEY = 'paotang_avengers_simple_v1';
    const HERO_KEY = 'paotang_avengers_hero_v1';
    const HIDE_KEY = 'paotang_avengers_hide_v1';

    const CATEGORIES = [
      { id: 'food', name: 'อาหาร/เครื่องดื่ม', icon: '🍔' },
      { id: 'travel', name: 'เดินทาง/น้ำมัน', icon: '🚗' },
      { id: 'shop', name: 'ซื้อของใช้', icon: '🛍️' },
      { id: 'bill', name: 'บิล/ค่าเน็ต', icon: '📱' },
      { id: 'salary', name: 'เงินเดือน/รายรับ', icon: '💰' },
      { id: 'other', name: 'อื่นๆ', icon: '⚡' }
    ];

    const HERO_THEMES = {
      ironman: { primary: '#DC2626', accent: '#38BDF8', label: 'ไอรอนแมน' },
      captain: { primary: '#1D4ED8', accent: '#60A5FA', label: 'กัปตัน' },
      thor:    { primary: '#0284C7', accent: '#FACC15', label: 'ธอร์' },
      panther: { primary: '#6D28D9', accent: '#C084FC', label: 'แพนเธอร์' }
    };

    let transactions = [];
    let currentType = 'expense';
    let selectedCategory = 'food';
    let currentFilter = 'month';
    let editingId = null;
    let hideBalance = false;
    let currentHero = 'ironman';

    // คืนค่าเวลาประเทศไทยปัจจุบัน (UTC+7)
    function getThaiNowParts() {
      const now = new Date();
      const fmt = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Bangkok',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
      const parts = {};
      fmt.formatToParts(now).forEach(p => { parts[p.type] = p.value; });
      const hour = parts.hour === '24' ? '00' : parts.hour;
      return {
        dateStr: `${parts.year}-${parts.month}-${parts.day}`,
        timeStr: `${hour}:${parts.minute}`,
        clockStr: `${hour}:${parts.minute}:${parts.second}`,
        yearMonth: `${parts.year}-${parts.month}`
      };
    }

    function formatThaiDateLabel(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      return `${d} ${months[m - 1]} ${y + 543}`;
    }

    function updateThaiClock() {
      const now = new Date();
      const parts = getThaiNowParts();
      document.getElementById('thai-clock').textContent = parts.clockStr;

      const thaiFullDate = new Intl.DateTimeFormat('th-TH', {
        timeZone: 'Asia/Bangkok',
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      }).format(now);
      document.getElementById('thai-date').textContent = thaiFullDate;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2200);
    }

    function formatMoney(num, showDecimals = false) {
      if (hideBalance) return '฿•••••';
      return '฿' + Number(num).toLocaleString('th-TH', {
        minimumFractionDigits: showDecimals ? 2 : 0,
        maximumFractionDigits: 2
      });
    }

    function setHero(heroKey) {
      if (!HERO_THEMES[heroKey]) heroKey = 'ironman';
      currentHero = heroKey;
      localStorage.setItem(HERO_KEY, heroKey);

      Object.keys(HERO_THEMES).forEach(k => {
        const el = document.getElementById('hero-' + k);
        if (k === heroKey) {
          el.className = 'hero-pill px-2.5 py-1 rounded-lg text-xs font-bold border border-white bg-white text-slate-900 transition flex items-center gap-1 shadow-sm';
        } else {
          el.className = 'hero-pill px-2.5 py-1 rounded-lg text-xs font-semibold border border-white/25 bg-white/10 text-white hover:bg-white/20 transition flex items-center gap-1';
        }
      });

      const theme = HERO_THEMES[heroKey];
      document.getElementById('arc-outer-ring').setAttribute('stroke', theme.accent);
      document.getElementById('arc-mid-ring').setAttribute('stroke', theme.accent);
      document.getElementById('arc-tri').setAttribute('stroke', theme.accent);
      document.getElementById('arc-core').setAttribute('fill', theme.accent);
    }

    function toggleHideBalance() {
      hideBalance = !hideBalance;
      localStorage.setItem(HIDE_KEY, hideBalance ? '1' : '0');
      document.getElementById('eye-icon').textContent = hideBalance ? '🙈' : '👁️';
      document.getElementById('eye-text').textContent = hideBalance ? 'แสดงยอด' : 'ซ่อนยอด';
      renderAll();
    }

    function toggleCustomTime() {
      const box = document.getElementById('custom-time-box');
      const isHidden = box.classList.contains('hidden');
      if (isHidden) {
        if (!document.getElementById('input-date').value) {
          resetToNowThai();
        }
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
      }
    }

    function resetToNowThai() {
      const nowParts = getThaiNowParts();
      document.getElementById('input-date').value = nowParts.dateStr;
      document.getElementById('input-time').value = nowParts.timeStr;
      document.getElementById('time-toggle-label').textContent = 'เวลาตอนนี้';
    }

    function setTxType(type) {
      currentType = type;
      const expBtn = document.getElementById('type-expense');
      const incBtn = document.getElementById('type-income');
      const submitBtn = document.getElementById('btn-submit');

      if (type === 'expense') {
        expBtn.className = 'py-2.5 rounded-lg text-base font-bold transition flex items-center justify-center gap-1.5 bg-red-600 text-white shadow-sm';
        incBtn.className = 'py-2.5 rounded-lg text-base font-bold transition flex items-center justify-center gap-1.5 text-slate-700 hover:bg-white/60';
        submitBtn.className = 'w-full armor-btn bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white font-bold text-lg py-3.5 shadow-sm transition flex items-center justify-center gap-2';
        if (selectedCategory === 'salary') selectedCategory = 'food';
      } else {
        incBtn.className = 'py-2.5 rounded-lg text-base font-bold transition flex items-center justify-center gap-1.5 bg-emerald-600 text-white shadow-sm';
        expBtn.className = 'py-2.5 rounded-lg text-base font-bold transition flex items-center justify-center gap-1.5 text-slate-700 hover:bg-white/60';
        submitBtn.className = 'w-full armor-btn bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold text-lg py-3.5 shadow-sm transition flex items-center justify-center gap-2';
        if (selectedCategory === 'food') selectedCategory = 'salary';
      }
      renderCategories();
    }

    function renderCategories() {
      const grid = document.getElementById('category-grid');
      grid.innerHTML = CATEGORIES.map(cat => {
        const active = cat.id === selectedCategory;
        const activeStyle = currentType === 'expense'
          ? 'border-red-600 bg-red-50 text-red-900 font-bold ring-1 ring-red-600'
          : 'border-emerald-600 bg-emerald-50 text-emerald-900 font-bold ring-1 ring-emerald-600';
        const normalStyle = 'border-slate-200 bg-slate-50 text-slate-800 hover:bg-slate-100 font-medium';

        return `
          <button type="button" onclick="selectCategory('${cat.id}')"
            class="border rounded-xl py-2.5 px-2 flex flex-col items-center justify-center gap-1 text-center transition active:scale-95 ${active ? activeStyle : normalStyle}">
            <span class="text-xl leading-none">${cat.icon}</span>
            <span class="text-xs leading-tight">${cat.name}</span>
          </button>
        `;
      }).join('');
    }

    function selectCategory(id) {
      selectedCategory = id;
      renderCategories();
    }

    function addQuickAmount(val) {
      const input = document.getElementById('input-amount');
      const current = parseFloat(input.value) || 0;
      input.value = current + val;
    }

    function clearAmount() {
      document.getElementById('input-amount').value = '';
      document.getElementById('input-amount').focus();
    }

    function saveTransaction() {
      const amountVal = parseFloat(document.getElementById('input-amount').value);
      if (!amountVal || amountVal <= 0) {
        showToast('กรุณาใส่จำนวนเงินก่อนบันทึก');
        document.getElementById('input-amount').focus();
        return;
      }

      const nowParts = getThaiNowParts();
      const customBoxOpen = !document.getElementById('custom-time-box').classList.contains('hidden');
      const dateStr = (customBoxOpen && document.getElementById('input-date').value)
        ? document.getElementById('input-date').value
        : (editingId ? document.getElementById('input-date').value : nowParts.dateStr);
      const timeStr = (customBoxOpen && document.getElementById('input-time').value)
        ? document.getElementById('input-time').value
        : (editingId ? document.getElementById('input-time').value : nowParts.timeStr);

      const note = document.getElementById('input-note').value.trim();

      if (editingId) {
        const idx = transactions.findIndex(t => t.id === editingId);
        if (idx !== -1) {
          transactions[idx] = {
            ...transactions[idx],
            type: currentType,
            amount: amountVal,
            category: selectedCategory,
            note,
            date: dateStr,
            time: timeStr
          };
        }
        showToast('แก้ไขรายการเรียบร้อย');
        cancelEdit();
      } else {
        transactions.unshift({
          id: Date.now().toString(),
          type: currentType,
          amount: amountVal,
          category: selectedCategory,
          note,
          date: dateStr,
          time: timeStr
        });
        document.getElementById('input-amount').value = '';
        document.getElementById('input-note').value = '';
        document.getElementById('custom-time-box').classList.add('hidden');
        document.getElementById('time-toggle-label').textContent = 'เวลาตอนนี้';
        showToast(currentType === 'expense' ? 'บันทึกรายจ่ายแล้ว' : 'บันทึกรายรับแล้ว');
      }

      persistData();
      renderAll();
    }

    function startEdit(id) {
      const tx = transactions.find(t => t.id === id);
      if (!tx) return;

      editingId = id;
      setTxType(tx.type);
      selectedCategory = tx.category;
      renderCategories();

      document.getElementById('input-amount').value = tx.amount;
      document.getElementById('input-note').value = tx.note || '';
      document.getElementById('input-date').value = tx.date;
      document.getElementById('input-time').value = tx.time;
      document.getElementById('custom-time-box').classList.remove('hidden');
      document.getElementById('time-toggle-label').textContent = `${formatThaiDateLabel(tx.date)} ${tx.time} น.`;

      document.getElementById('form-title').innerHTML = `
        <span class="w-2 h-5 bg-amber-500 rounded-sm inline-block"></span>
        <span>แก้ไขรายการ</span>
      `;
      document.getElementById('submit-label').textContent = 'บันทึกการแก้ไข';
      document.getElementById('btn-cancel-edit').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('input-amount').value = '';
      document.getElementById('input-note').value = '';
      document.getElementById('custom-time-box').classList.add('hidden');
      document.getElementById('time-toggle-label').textContent = 'เวลาตอนนี้';
      document.getElementById('form-title').innerHTML = `
        <span class="w-2 h-5 bg-red-600 rounded-sm inline-block"></span>
        <span>จดรายการใหม่</span>
      `;
      document.getElementById('submit-label').textContent = 'บันทึกเลย';
      document.getElementById('btn-cancel-edit').classList.add('hidden');
    }

    function deleteTransaction(id) {
      transactions = transactions.filter(t => t.id !== id);
      if (editingId === id) cancelEdit();
      persistData();
      renderAll();
      showToast('ลบรายการแล้ว');
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['today', 'month', 'all'].forEach(f => {
        const btn = document.getElementById('filter-' + f);
        if (f === filter) {
          btn.className = 'px-2.5 py-1 rounded-lg bg-slate-900 text-white shadow-sm transition';
        } else {
          btn.className = 'px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-900 transition';
        }
      });
      renderList();
    }

    function getFilteredTransactions() {
      const nowParts = getThaiNowParts();
      const sorted = [...transactions].sort((a, b) => {
        const keyA = `${a.date} ${a.time}`;
        const keyB = `${b.date} ${b.time}`;
        return keyB.localeCompare(keyA);
      });

      if (currentFilter === 'today') {
        return sorted.filter(t => t.date === nowParts.dateStr);
      }
      if (currentFilter === 'month') {
        return sorted.filter(t => t.date.startsWith(nowParts.yearMonth));
      }
      return sorted;
    }

    function renderSummary() {
      let income = 0;
      let expense = 0;
      transactions.forEach(t => {
        if (t.type === 'income') income += Number(t.amount);
        else expense += Number(t.amount);
      });
      const balance = income - expense;

      document.getElementById('balance-display').textContent = formatMoney(balance, true);
      document.getElementById('income-display').textContent = formatMoney(income, false);
      document.getElementById('expense-display').textContent = formatMoney(expense, false);

      const badge = document.getElementById('energy-badge');
      const arcCore = document.getElementById('arc-core');
      const themeAccent = HERO_THEMES[currentHero].accent;

      if (balance < 0) {
        badge.textContent = 'รายจ่ายเกินรายรับ';
        badge.className = 'text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-500/30 text-rose-200 border border-rose-400/50';
        arcCore.setAttribute('fill', '#F43F5E');
      } else if (income > 0 && expense / income > 0.75) {
        badge.textContent = 'ใช้จ่ายไปเยอะแล้ว';
        badge.className = 'text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-500/30 text-amber-200 border border-amber-400/50';
        arcCore.setAttribute('fill', '#F59E0B');
      } else {
        badge.textContent = 'การเงินคล่องตัว';
        badge.className = 'text-[11px] font-bold px-2 py-0.5 rounded-full bg-sky-500/25 text-sky-200 border border-sky-400/40';
        arcCore.setAttribute('fill', themeAccent);
      }
    }

    function renderList() {
      const listEl = document.getElementById('transaction-list');
      const items = getFilteredTransactions();

      if (items.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-8 bg-slate-50 rounded-xl border border-dashed border-slate-300">
            <div class="text-3xl mb-1">📋</div>
            <div class="text-sm font-bold text-slate-700">ยังไม่มีรายการในช่วงเวลานี้</div>
            <div class="text-xs text-slate-500 mt-0.5">กรอกตัวเลขด้านบนแล้วกดบันทึกได้เลย</div>
          </div>
        `;
        return;
      }

      listEl.innerHTML = items.map(tx => {
        const cat = CATEGORIES.find(c => c.id === tx.category) || CATEGORIES[5];
        const isInc = tx.type === 'income';
        const amountClass = isInc ? 'text-emerald-700' : 'text-red-600';
        const sign = isInc ? '+' : '-';
        const title = tx.note ? tx.note : cat.name;
        const subtitle = tx.note ? `${cat.name} • ` : '';

        return `
          <div class="bg-slate-50 hover:bg-slate-100/80 border border-slate-200 rounded-xl p-3 flex items-center justify-between gap-2.5 transition">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-11 h-11 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-xl shrink-0 shadow-xs">
                ${cat.icon}
              </div>
              <div class="min-w-0">
                <div class="text-sm font-bold text-slate-900 truncate">${escapeHtml(title)}</div>
                <div class="text-xs font-medium text-slate-600 mt-0.5">
                  ${escapeHtml(subtitle)}${formatThaiDateLabel(tx.date)} เวลา ${tx.time} น.
                </div>
              </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <div class="font-num text-base font-bold ${amountClass}">
                ${hideBalance ? '฿•••' : `${sign}฿${Number(tx.amount).toLocaleString('th-TH')}`}
              </div>
              <button type="button" onclick="startEdit('${tx.id}')" title="แก้ไข" class="w-8 h-8 rounded-lg bg-white border border-slate-200 hover:bg-slate-200 flex items-center justify-center text-xs">
                ✏️
              </button>
              <button type="button" onclick="deleteTransaction('${tx.id}')" title="ลบ" class="w-8 h-8 rounded-lg bg-white border border-slate-200 hover:bg-rose-100 flex items-center justify-center text-xs">
                🗑️
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function persistData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    }

    function loadSampleData() {
      const nowParts = getThaiNowParts();
      const samples = [
        { id: 's1', type: 'income', amount: 28000, category: 'salary', note: 'เงินเดือนเข้า', date: nowParts.dateStr, time: '09:00' },
        { id: 's2', type: 'expense', amount: 65, category: 'food', note: 'ข้าวกะเพราไข่ดาว + น้ำ', date: nowParts.dateStr, time: '12:15' },
        { id: 's3', type: 'expense', amount: 500, category: 'travel', note: 'เติมน้ำมันรถ', date: nowParts.dateStr, time: '17:40' },
        { id: 's4', type: 'expense', amount: 399, category: 'bill', note: 'ค่าอินเทอร์เน็ตรายเดือน', date: nowParts.dateStr, time: '19:10' }
      ];
      transactions = [...samples, ...transactions];
      persistData();
      renderAll();
      showToast('เพิ่มข้อมูลตัวอย่างแล้ว');
    }

    function clearAllData() {
      if (transactions.length === 0) {
        showToast('ไม่มีข้อมูลให้ล้าง');
        return;
      }
      if (confirm('ต้องการลบประวัติรายรับรายจ่ายทั้งหมดใช่หรือไม่?')) {
        transactions = [];
        cancelEdit();
        persistData();
        renderAll();
        showToast('ล้างข้อมูลทั้งหมดเรียบร้อย');
      }
    }

    function exportCSV() {
      if (transactions.length === 0) {
        showToast('ยังไม่มีรายการสำหรับดาวน์โหลด');
        return;
      }

      const headers = ['วันที่', 'เวลา (ไทย)', 'ประเภท', 'หมวดหมู่', 'รายละเอียด', 'จำนวนเงิน (บาท)'];
      const rows = getFilteredTransactions().map(t => {
        const cat = CATEGORIES.find(c => c.id === t.category)?.name || 'อื่นๆ';
        const typeLabel = t.type === 'income' ? 'รายรับ' : 'รายจ่าย';
        return [
          formatThaiDateLabel(t.date),
          t.time + ' น.',
          typeLabel,
          cat,
          `"${(t.note || '').replace(/"/g, '""')}"`,
          t.amount
        ].join(',');
      });

      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `รายรับรายจ่าย_${getThaiNowParts().dateStr}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('ดาวน์โหลดไฟล์ Excel เรียบร้อย');
    }

    function renderAll() {
      renderSummary();
      renderList();
    }

    // เริ่มต้นการทำงาน
    (function init() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) transactions = JSON.parse(saved);
      } catch (e) {
        transactions = [];
      }

      const savedHero = localStorage.getItem(HERO_KEY) || 'ironman';
      setHero(savedHero);

      hideBalance = localStorage.getItem(HIDE_KEY) === '1';
      document.getElementById('eye-icon').textContent = hideBalance ? '🙈' : '👁️';
      document.getElementById('eye-text').textContent = hideBalance ? 'แสดงยอด' : 'ซ่อนยอด';

      updateThaiClock();
      setInterval(updateThaiClock, 1000);

      setTxType('expense');
      setFilter('month');
      renderAll();
    })();
  </script>
</body>
</html>
